<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Class Attendance & Fee Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen">
    <div class="login-box">
      <h1>Class Manager</h1>
      <p class="sub">Sign in with your admin email</p>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="you@example.com" autocomplete="username" />
      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button class="btn-primary" id="login-btn">Sign In</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app" class="hidden">
    <div class="sidebar">
      <div class="brand">Class Manager<small>Attendance & Fees</small></div>
      <div class="nav-item active" data-page="dashboard">Dashboard</div>
      <div class="nav-item" data-page="students">Students</div>
      <div class="nav-item" data-page="attendance">Attendance</div>
      <div class="nav-item" data-page="fees">Fees</div>
      <div class="sidebar-footer">
        <div class="email" id="current-user-email"></div>
        <button class="btn-secondary" id="logout-btn" style="width:100%">Log Out</button>
      </div>
    </div>

    <div class="main">

      <!-- ---------- DASHBOARD ---------- -->
      <div class="page active" id="page-dashboard">
        <div class="page-header"><h2>Dashboard</h2></div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="label">Total Students</div>
            <div class="value" id="stat-total-students">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Present Today</div>
            <div class="value green" id="stat-present-today">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Absent Today</div>
            <div class="value danger" id="stat-absent-today">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Fees Collected (this month)</div>
            <div class="value green" id="stat-fees-collected">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Fees Outstanding (this month)</div>
            <div class="value danger" id="stat-fees-due">0</div>
          </div>
        </div>
        <div class="panel">
          <h3>Recent Fee Activity</h3>
          <div id="recent-fees-table"></div>
        </div>
      </div>

      <!-- ---------- STUDENTS ---------- -->
      <div class="page" id="page-students">
        <div class="page-header">
          <h2>Students</h2>
          <button class="btn-primary" style="width:auto" id="add-student-btn">+ Add Student</button>
        </div>
        <div class="toolbar">
          <input id="student-search" placeholder="Search by name..." />
          <select id="student-class-filter"><option value="">All Classes</option></select>
        </div>
        <div class="panel">
          <div id="students-table"></div>
        </div>
      </div>

      <!-- ---------- ATTENDANCE ---------- -->
      <div class="page" id="page-attendance">
        <div class="page-header"><h2>Attendance</h2></div>
        <div class="toolbar">
          <input type="date" id="attendance-date" />
          <select id="attendance-class-filter"><option value="">All Classes</option></select>
          <button class="btn-secondary" id="mark-all-present">Mark All Present</button>
        </div>
        <div class="panel">
          <div id="attendance-list" class="attendance-grid"></div>
        </div>
      </div>

      <!-- ---------- FEES ---------- -->
      <div class="page" id="page-fees">
        <div class="page-header"><h2>Fees</h2></div>
        <div class="toolbar">
          <input type="month" id="fees-month" />
          <select id="fees-class-filter"><option value="">All Classes</option></select>
        </div>
        <div class="panel">
          <div id="fees-table"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===================== MODALS (populated by JS) ===================== -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
